name: CI

on:
  push:
    branches: [main]
    # A tag IS the release here: there is no release workflow to gate, and the
    # package is resolvable the moment the tag lands. Running CI on it cannot
    # block a bad release, but it turns one into a red run and an email rather
    # than silence - which is how a package that did not compile sat published
    # for three days.
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version composer.json declares support for, floor first: a floor
        # no leg runs is a claim rather than a fact. The matrix is wide because
        # the PHPUnit major that supports 8.2 is not the one that supports 8.5 -
        # these four legs resolve 11, 12, 13 and 13 - so each leg is a different
        # test toolchain and not merely a different interpreter.
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
      # No lockfile is committed, because a library must resolve against the PHP
      # its consumer is on rather than against one pinned set.
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/phpunit

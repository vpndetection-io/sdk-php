openapi: 3.0.3
info:
  title: VPNDetection API
  description: |
    The VPNDetection API: classify any IP address, and download the databases
    behind the answers.

    Lookups need no API key: Unlimited, the free plan, answers any address with
    no daily or monthly cap, with a key or without one. The Data plan answers
    every field, and a free account tries them. Unlimited's answers may be used
    commercially, but not redistributed or used in a competing service
    (https://vpndetection.io/terms#no-key).

    See https://docs.vpndetection.io for guides and https://github.com/vpndetection-io
    for the official client libraries.
  contact:
    name: VPNDetection Support
    email: support@vpndetection.io
    url: https://vpndetection.io
  termsOfService: https://vpndetection.io/terms
  version: 2026.11.26
servers:
  - url: https://api.vpndetection.io
    description: Production
tags:
  - name: Lookup
    description: Classify an IP address.
    x-displayName: Lookup
  - name: Database
    description: List and download the licensed databases.
    x-displayName: Database
  - name: Entitlement
    description: What your key may spend, and what it has.
    x-displayName: Entitlement
  - name: Account
    description: Who the credential belongs to, and what it may do.
    x-displayName: Account
  - name: Organization
    description: The organization it is scoped to.
    x-displayName: Organization
  - name: API keys
    description: Creating, listing and rotating credentials.
    x-displayName: API keys
  - name: Authorization
    description: Obtaining and revoking tokens.
    x-displayName: Authorization
paths:
  /{ip}:
    get:
      operationId: lookupIp
      tags:
        - Lookup
      summary: Lookup
      description: |
        Answers what is known about a single IPv4 or IPv6 address. Which fields
        come back is decided by the presented key; with no key, on Unlimited,
        the free plan, the answer is `ip`, `is_vpn`, the Tor and relay members,
        `is_anycast`, `hostname`, `location` and `asn`.
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            type: string
          description: The IPv4 or IPv6 address to classify.
          examples:
            ipv4:
              value: 1.1.1.1
            ipv6:
              value: 2606:4700:4700::1111
        - in: query
          name: user_agent
          required: false
          schema:
            type: string
            maxLength: 1024
          description: |
            The `User-Agent` header of the request you are deciding on. With
            every field, on a paid plan or the trial, the answer then carries
            `user_agent`: the agent it names, and whether this address bears
            that out. Never kept, and nothing sent with a lookup feeds our data.
          example: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
      responses:
        '200':
          description: |
            The classification. Present fields are those your plan includes; see
            the tier table in the API description.

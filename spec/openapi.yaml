        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
  /api/v1/iam/apikeys/{id}/rotate:
    post:
      operationId: accountRotateApikey
      tags:
        - API keys
      summary: Rotate
      description: |
        Replaces the secret behind a key, keeping its ID, name and settings.
        The previous secret stops working immediately. The new secret comes
        back in the answer, so this needs `apikeys.reveal` as well as
        `apikeys.manage`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApikeyIdParam'
      responses:
        '200':
          description: The key, with its new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreatedApikey'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /api/v1/iam/apikeys/{id}/revoke:
    post:
      operationId: accountRevokeApikey
      tags:
        - API keys
      summary: Revoke
      description: |
        Stops the key working. Revocation is soft: the key stays listed with a
        `revoked_at`, because the organization still owns whatever it did while
        it was alive.

        Needs the `apikeys.manage` scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApikeyIdParam'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRc'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /api/v1/iam/apikeys/{id}/reveal:
    post:
      operationId: accountRevealApikey
      tags:
        - API keys
      summary: Reveal
      description: |
        Returns an existing key's secret.

        It needs the `apikeys.reveal` scope, which `apikeys.manage` doesn't
        include.

        Refused with `NOT_RETRIEVABLE` for a key issued before we kept secrets.
        Rotate that key instead.

        Needs the `apikeys.reveal` scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApikeyIdParam'
      responses:
        '200':
          description: The key's secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRevealedApikey'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
        '404':
          description: |
            No such key in this organization, or its secret was never stored
            recoverably (`NOT_RETRIEVABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRc'
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthMetadata
      tags:
        - Authorization
      summary: Discovery
      description: |
        RFC 8414 authorization server metadata: the endpoints, the grant types
        and the scopes this server supports.

        Read this rather than hardcoding endpoints. It is also served at
        `/.well-known/openid-configuration`, identically, because several
        clients probe that path first.
      security: []
      responses:
        '200':
          description: The server's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthMetadata'
  /oauth/device_authorization:
    post:
      operationId: oauthDeviceAuthorization
      tags:
        - Authorization
      summary: Device authorization
      description: |
        Starts the device flow. Show the `user_code` to the person and send them
        to `verification_uri`; `verification_uri_complete` has the code already
        embedded, which is what to open if you can open a browser at all.

        Then poll `/oauth/token`, no faster than `interval` seconds.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
      responses:
        '200':
          description: A pending device authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorization'
        '400':
          description: |
            `invalid_request`, `unauthorized_client` when the client may not use
            the device flow, or `slow_down` when this address has started too
            many authorizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
        '401':
          description: '`invalid_client`: the `client_id` is not registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
  /oauth/register:
    post:
      operationId: oauthRegister
      tags:
        - Authorization
      summary: Register
      description: |
        RFC 7591 dynamic client registration, for a client that cannot use a
        Client ID Metadata Document. Post your client's metadata as JSON, then
        use the `client_id` in the answer at `/oauth/authorize` and
        `/oauth/token`. Nothing is kept until a person approves your client, so
        registering again costs nothing and leaves nothing to clean up.

        Each redirect URI must be https on a public host name, or http on a
        loopback address (`127.0.0.1`, `[::1]`, `localhost`), which then
        matches on any port. A custom URI scheme is refused: use a loopback
        redirect instead. So is a host on one of our own domains.

        `client_name` is shown to the person as your client's own claim, with
        where its redirect goes beside it. A name that renders blank, or mixes
        Latin letters with Cyrillic or Greek ones, is shown as an unnamed
        application.

        The client is public whatever you ask for: `token_endpoint_auth_method`
        comes back `none`, there is no client secret, and every authorization
        proves itself with PKCE. It may be granted `apikeys.use` at most.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: The client, as registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistration'
        '400':
          description: |
            `invalid_redirect_uri` names the redirect URI refused and why, and
            `invalid_client_metadata` anything else, such as a client that
            does not use the authorization code flow. `slow_down` means this
            address registered too many clients in the last minute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      tags:
        - Authorization
      summary: Authorize
      description: |
        The browser entry point for the authorization-code flow. This is a
        redirect target, not something to call from code.

        Any client may sign in without registering first by using a Client ID
        Metadata Document: make `client_id` an https URL that serves your
        client's metadata as JSON, naming that same URL as its `client_id`,
        with `token_endpoint_auth_method` `none` and your `redirect_uris`. An
        https redirect URI must be on the same origin as the `client_id`; a
        loopback one (`http://127.0.0.1`, `http://[::1]`, `http://localhost`)
        matches on any port. Such a client is granted `apikeys.use` at most. A
        client registered at `/oauth/register` uses the `client_id` it was
        given and one of the `redirect_uris` it registered.

        An unknown `client_id` or an unregistered `redirect_uri` is shown to the
        person and never redirected, because sending an error to an address we
        have not verified belongs to you is how an open redirector works. Any
        other error in the request is shown to the person too: anyone can make a
        client, so its `redirect_uri` is verified only as its own (RFC 9700
        section 4.11.2). Only the person's answer comes back to your
        `redirect_uri`: a `code`, or `error` `access_denied`, each with your
        `state` and `iss`.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
          description: S256, named explicitly. `plain`, or no method at all, is refused rather than downgraded.
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Returned unchanged. Use it to bind the response to your request.
        - name: resource
          in: query
          required: false
          schema:
            type: string
          description: |
            RFC 8707. What the token is FOR, so it cannot be replayed elsewhere:
            this brand's MCP server, the only resource it issues tokens for.
            Anything else answers `invalid_target`. A client that names none is
            given that server.
      responses:
        '302':
          description: A redirect to the consent screen.
        '400':
          description: Shown to the person. No error in the request is sent to your redirect_uri.
        '429':
          description: Shown to the user. Too many authorizations from one address.
  /oauth/token:
    post:
      operationId: oauthToken
      tags:
        - Authorization
      summary: Token
      description: |
        Issues tokens for three grant types: a device code, an authorization
        code and a refresh token.

        `urn:ietf:params:oauth:grant-type:device_code` polls a device
        authorization. Until the person approves it answers
        `authorization_pending`; poll faster than `interval` and it answers
        `slow_down`, which means widen your interval and keep it widened.

        `authorization_code` exchanges a code from `/oauth/authorize`, with the
        `code_verifier` matching the challenge you sent and the same
        `redirect_uri`. A code works once: presenting it again also revokes
        what the first exchange issued.

        `refresh_token` exchanges a refresh token. The presented token is
        consumed whatever happens next, so store the new one before using it.
        Presenting a consumed refresh token again ends the whole authorization,
        since it means the token was copied.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |
            An RFC 6749 error. `authorization_pending` and `slow_down` are
            normal answers while polling a device authorization, not failures.
            `access_denied` means the person refused, and `expired_token` that
            the device code is no longer valid: it expired, or it was already
            exchanged or refused. `invalid_grant` means the code, device code or
            refresh token is not valid for this `client_id`. `invalid_target`
            means `resource` names something other than what was authorized.
            `slow_down` also answers any grant when this address sends too many
            requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
        '401':
          description: '`invalid_client`: the `client_id` is not registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      tags:
        - Authorization
      summary: Revoke
      description: |
        RFC 7009. Always answers 200, even for a token that was never valid, so
        it can't be used to test whether a token is live.

        Revoking a refresh token ends the whole authorization and takes its
        access tokens with it. Revoking an access token affects only that token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Always, whatever was presented.
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <key>`.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: '`X-Api-Key: <key>`.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: '`?apikey=<key>`. Convenient in a browser; prefer a header elsewhere.'
  schemas:
    LookupResponse:
      type: object
      description: |
        The union of every tier's answer. Every answer carries `ip`, `is_bogon`,
        `is_vpn`, the Tor and relay members, `is_anycast`, `hostname`, `location` and
        `asn`, with or without a key;
        each remaining field is present when your tier includes it, and absent
        otherwise. A client that must work across plans should treat an absent
        flag as unknown rather than as `false`.
      required:
        - ip
        - is_vpn
      properties:
        ip:
          type: string
          description: The address that was looked up, normalized.
          example: 1.1.1.1
        is_bogon:
          type: boolean
          description: |
            Whether the address is reserved space (RFC 1918, loopback, link-local,
            documentation ranges and their IPv6 equivalents), answered from the
            address alone. Every answer, with or without a key.
        is_vpn:
          type: boolean
          description: |
            Whether the address is VPN infrastructure. Keys off presence in the
            VPN dataset, so an unattributed range with no provider is still
            `true`.
        is_hosting:
          type: boolean
          description: Whether the address belongs to a hosting or cloud provider. On a paid plan.
        is_relay:
          type: boolean
          description: >-
            Whether the address is privacy relay or enterprise web gateway egress, such as iCloud
            Private Relay or Zscaler. Every answer, with or without a key.
        is_tor:
          type: boolean
          description: Whether the address is a Tor node. Every answer, with or without a key.
        is_cdn:
          type: boolean
          description: Whether the address belongs to a CDN. On a paid plan.
        is_bot:
          type: boolean
          description: >-
            Whether an automated client uses the address, such as a search engine's or an AI
            company's crawler, an uptime monitor, an internet scanner or a webhook sender. `bot`
            says whose, what it does and whether its operator vouches for the address. On a paid
            plan.
        is_resproxy:
          type: boolean
          description: Whether the address was seen in a residential proxy pool. On a paid plan.
        is_dcproxy:
          type: boolean
          description: >-
            Whether the address is one a datacenter proxy service sells or runs on, a proxy
            company's own ranges included. On a paid plan.
        is_mobproxy:
          type: boolean
          description: Whether the address was seen in a mobile proxy pool. On a paid plan.
        is_pubproxy:
          type: boolean
          description: >-
            Whether a public proxy, one anyone can connect through, listens on the address or sends
            its traffic out from it. On a paid plan.
        is_anycast:
          type: boolean
          description: >-
            Whether the address is announced from many places at once, as a public DNS resolver's or
            a CDN's edge is. Every answer, with or without a key.
        is_carrier:
          type: boolean
          description: >-
            Whether the address is a mobile carrier's, where many phones can share one address. On a
            paid plan.
        is_satellite:
          type: boolean
          description: Whether the address is a satellite operator's. On a paid plan.
        is_ssh:
          type: boolean
          description: Whether an SSH server answered on the address. On a paid plan.
        is_smtp:
          type: boolean
          description: Whether a mail server answered on the address. On a paid plan.
        is_web:
          type: boolean
          description: Whether a web server answered on the address, on port 80 or 443. On a paid plan.
        is_dns_resolver:
          type: boolean
          description: Whether an open DNS resolver answered on the address. On a paid plan.
        is_bittorrent:
          type: boolean
          description: Whether a BitTorrent client was seen on the address in the last 90 days. On a paid plan.
        vpn:
          allOf:
            - $ref: '#/components/schemas/VpnDetail'
          description: |
            Detail for `is_vpn`. Empty when `is_vpn` is false. On a paid plan.
        hosting:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: Detail for `is_hosting`. Empty when false. On a paid plan.
        relay:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: Detail for `is_relay`. Empty when false. Every answer, with or without a key.
        tor:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: |
            Detail for `is_tor`. Empty when false. Every answer, with or without a
            key. The tor dataset carries no provider, so `provider` and
            `provider_name` are always empty strings.
        cdn:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: Detail for `is_cdn`. Empty when false. On a paid plan.
        bot:
          allOf:
            - $ref: '#/components/schemas/BotDetail'
          description: Detail for `is_bot`. Empty when false. On a paid plan.
        resproxy:
          allOf:
            - $ref: '#/components/schemas/ProxyDetail'
          description: Detail for `is_resproxy`. Empty when false. On a paid plan.
        dcproxy:
          allOf:
            - $ref: '#/components/schemas/ProxyDetail'
          description: Detail for `is_dcproxy`. Empty when false. On a paid plan.
        mobproxy:
          allOf:
            - $ref: '#/components/schemas/ProxyDetail'
          description: Detail for `is_mobproxy`. Empty when false. On a paid plan.
        pubproxy:
          allOf:
            - $ref: '#/components/schemas/PubproxyDetail'
          description: Detail for `is_pubproxy`. Empty when false. On a paid plan.
        carrier:
          allOf:
            - $ref: '#/components/schemas/CarrierDetail'
          description: Detail for `is_carrier`. Empty when false. On a paid plan.
        satellite:
          allOf:
            - $ref: '#/components/schemas/SatelliteDetail'
          description: Detail for `is_satellite`. Empty when false. On a paid plan.
        ssh:
          allOf:
            - $ref: '#/components/schemas/SshDetail'
          description: Detail for `is_ssh`. Empty when false. On a paid plan.
        smtp:
          allOf:
            - $ref: '#/components/schemas/SmtpDetail'
          description: Detail for `is_smtp`. Empty when false. On a paid plan.
        web:
          type: array
          items:
            $ref: '#/components/schemas/WebDetail'
          description: >-
            Detail for `is_web`: a row per port that answered, lowest first, and `[]` when false. On
            a paid plan.
        dns_resolver:
          allOf:
            - $ref: '#/components/schemas/DnsResolverDetail'
          description: Detail for `is_dns_resolver`. Empty when false. On a paid plan.
        bittorrent:
          allOf:
            - $ref: '#/components/schemas/BitTorrentDetail'
          description: Detail for `is_bittorrent`. Empty when false. On a paid plan.
        location:
          $ref: '#/components/schemas/Location'
        asn:
          $ref: '#/components/schemas/Asn'
        company:
          $ref: '#/components/schemas/Company'
        hostname:
          type: string
          description: >-
            The name the address's reverse DNS (PTR) record points to, from our IP RDNS database; an
            empty string when it has none. Every answer, with or without a key.
          example: ''
        abuse:
          $ref: '#/components/schemas/AbuseContact'
        user_agent:
          allOf:
            - $ref: '#/components/schemas/UserAgentVerdict'
          description: |
            When the request sent `user_agent`, with every field: the agent it
            names and whether this address bears it out. Absent otherwise.
        trial_expired:
          type: boolean
          description: |
            On every answer to a key on the free plan, and on no other: `false`
            while its organization's trial of every field lasts, `true` once the
            answer has Unlimited's.
        cap_reached:
          type: boolean
          description: |
            On every answer to a key on a paid plan, and on no other: `false`
            while the answer has every field, `true` once its organization's
            overage cap is reached and the answer has Unlimited's. Lookups
            answered past the cap are not billed; raising or removing the cap in
            Billing turns it `false` again.
    BatchLookupRequest:
      type: object
      required:
        - ips
      properties:
        ips:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
          description: |
            The addresses to classify, 1 to 1000 per call, counted before
            duplicates collapse. Each distinct string is one lookup.
          example:
            - 1.1.1.1
            - 2606:4700:4700::1111
        user_agents:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
          description: |
            Each address's `User-Agent`, keyed by the string it is sent as in
            `ips`. With every field, that address's answer then carries
            `user_agent`, as a single lookup's does. Never kept.
          example:
            66.249.66.1: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
    BatchLookupResponse:
      type: object
      required:
        - results
        - errors
      properties:
        results:
          type: object
          description: |
            One answer per input string that was classified, keyed by the string
            as you sent it; the `ip` inside is the normalized form. Each value is
            exactly what `GET /{ip}` answers for your plan.
          additionalProperties:
            $ref: '#/components/schemas/LookupResponse'
        errors:
          type: object
          description: |
            One entry per input string that could not be classified, keyed the
            same way. Empty when every entry was answered.
          additionalProperties:
            $ref: '#/components/schemas/BatchLookupError'
    BatchLookupError:
      type: object
      description: Why one entry of a batch was not answered, as the single lookup would have reported it.
      required:
        - status
        - error
      properties:
        status:
          type: integer
          description: |
            The HTTP status `GET /{ip}` would have answered for this entry: `400`
            for a string that is not an address, `500` when the VPN dataset could
            not be consulted.
          example: 400
        error:
          type: string
          description: The same message the single lookup carries for that status.
          example: not a valid IP address
    VpnDetail:
      type: object
      description: |
        What is known about the VPN attribution. Every key is present when the
        object is populated, empty values included; the object is `{}` when
        `is_vpn` is false.
      properties:
        provider:
          type: string
          description: The VPN provider's ID, or an empty string for an unattributed range.
          example: mullvad
        provider_name:
          type: string
          description: |
            The name the provider catalog gives the provider, beside the ID to key on;
            an empty string where the catalog names none or the range is unattributed.
          example: Mullvad
        last_seen:
          type: string
          format: date
          description: The most recent date this address was observed as VPN infrastructure.
          example: '2026-09-02'
        confidence:
          type: string
          description: How strongly the attribution is supported.
          example: high
        method:
          type: string
          deprecated: true
          description: |
            Never returned since 2026-10-20: no plan is answered with the class of
            evidence an attribution rests on. Declared so that a client typed
            against it keeps compiling; read `confidence` instead.
    ClassDetail:
      type: object
      description: |
        The shared detail shape for the hosting, relay, tor and cdn datasets.
        Every key is present when the object is populated; the object is `{}`
        when its flag is false.
      properties:
        provider:
          type: string
          description: The provider's ID, or an empty string where the dataset has none.
          example: m247
        provider_name:
          type: string
          description: |
            The name the provider catalog gives the provider; an empty string where the
            catalog names none or the dataset has no provider.
          example: M247
        confidence:
          type: string
          description: How strongly the classification is supported.
          example: high
        last_seen:
          type: string
          format: date
          description: The most recent date this address was observed in this dataset.
          example: '2026-09-02'
    ProxyDetail:
      type: object
      description: |
        The shared detail shape for the residential, datacenter and mobile proxy
        families, measured over a rolling 90 day window. An address that leaves
        the window keeps its flag and the values of its last day in it, so
        `last_seen` is what says how recent they are. Every key is present when
        the object is populated; the object is `{}` when its flag is false.
      properties:
        provider:
          type: string
          description: The proxy network's ID, or an empty string where unattributed.
          example: brightdata
        provider_name:
          type: string
          description: |
            The name the provider catalog gives the proxy network; an empty string where
            the catalog names none or the address is unattributed.
          example: Bright Data
        first_seen:
          type: string
          format: date
          description: |
            The earliest date within the window this address was seen in the
            pool, as of its last day in the window once it has left.
          example: '2026-06-14'
        last_seen:
          type: string
          format: date
          description: |
            The most recent date this address was seen in the pool. An address
            that leaves the window keeps its flag, so this date is what says how
            recent the sighting is.
          example: '2026-09-02'
        hits:
          type: integer
          description: |
            How many times the address was observed in the pool during the
            window, as of its last day in it once it has left.
          example: 42
        hits_days_pct:
          type: integer
          description: |
            The percentage of days in the window on which the address was seen,
            as of its last day in it once it has left. A high value means a
            stable pool member rather than a one-off sighting.
          example: 63
        providers_num:
          type: integer
          description: How many distinct proxy networks this address was seen in.
          example: 2
    PubproxyDetail:
      type: object
      description: |
        The address in Public Proxy IP, open proxies anyone can connect
        through, measured over a rolling 90 day window. An address that leaves
        the window keeps its flag and the values of its last day in it, so
        `last_seen` is what says how recent they are. An address is either
        end of a proxy, or both: where it listens, and where its traffic
        leaves from. Every key is present when the object is populated; the
        object is `{}` when `is_pubproxy` is false.
      properties:
        entry:
          type: boolean
          description: Whether a public proxy listens on this address.
          example: true
        exit:
          type: boolean
          description: Whether a public proxy's traffic leaves from this address.
          example: false
        protocols:
          type: array
          items:
            type: string
          description: |
            The protocols of the proxies listening on or leaving from this
            address: `http`, `https` (an HTTP proxy that also tunnels HTTPS),
            `socks4` or `socks5`. Empty where only the address is known.
          example:
            - http
            - https
        num_ports:
          type: integer
          description: |
            How many distinct ports a public proxy listens on at this address;
            0 when it is only an exit, or its port is not known.
          example: 1
        num_proxies:
          type: integer
          description: |
            How many distinct public proxies' traffic left from this address;
            0 when it is only an entry.
          example: 0
        last_seen:
          type: string
          format: date
          description: |
            The most recent date a proxy on this address was seen. An address
            that leaves the window keeps its flag, so this date is what says how
            recent the sighting is.
          example: '2026-10-17'
        last_usable:
          type: string
          description: |
            The most recent date within the window a request through a proxy on
            this address was answered, as YYYY-MM-DD, or an empty string when
            none was, as of its last day in the window once it has left.
          example: '2026-10-17'
    Location:
      type: object
      description: |
        Where the address is: the fields of our IP Country database on every
        answer, with or without a key, and our IP Geolocation database's finer
        ones on a paid plan. Each field your plan includes is present whenever
        the object is, so an address in no country, or a private one, answers
        empty strings and zeros.
      required:
        - continent
        - continent_name
        - country
        - country_name
        - timezone
        - currency_code
        - currency_name
        - currency_symbol
        - flag_emoji
        - flag_unicode
      properties:
        continent:
          type: string
          description: 'Continent code: AF, AN (Antarctica), AS, EU, NA, OC or SA.'
          example: EU
        continent_name:
          type: string
          description: Continent name.
          example: Europe
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: AT
        country_name:
          type: string
          description: Country name.
          example: Austria
        timezone:
          type: string
          description: IANA timezone of the address.
          example: Europe/Vienna
        currency_code:
          type: string
          description: ISO 4217 code of the country's currency, where there is one.
          example: EUR
        currency_name:
          type: string
          description: Name of the country's currency, where there is one.
          example: Euro
        currency_symbol:
          type: string
          description: Symbol of the country's currency, where known.
          example: €
        flag_emoji:
          type: string
          description: The country's flag, as an emoji.
          example: 🇦🇹
        flag_unicode:
          type: string
          description: The Unicode code points of the flag emoji.
          example: U+1F1E6 U+1F1F9
        region:
          type: string
          description: Region (state or province). On a paid plan.
          example: Vienna
        region_code:
          type: string
          description: ISO 3166-2 region code. On a paid plan.
          example: AT-9
        city:
          type: string
          description: City. On a paid plan.
          example: Vienna
        postal_code:
          type: string
          description: Postal code. On a paid plan.
          example: '1230'
        latitude:
          type: number
          description: Latitude of the city. On a paid plan.
          example: 48.20849
        longitude:
          type: number
          description: Longitude of the city. On a paid plan.
          example: 16.37208
        accuracy_radius:
          type: integer
          description: >-
            Radius in km holding the true location with 67% confidence; 20000 for an address
            announced everywhere, as an anycast one is. On a paid plan.
          example: 10
        geoname_id:
          type: string
          description: GeoNames ID of the city. On a paid plan.
          example: '2761369'
        dma_code:
          type: string
          description: US TV market (DMA) code, empty outside the US. On a paid plan.
          example: ''
        last_changed:
          type: string
          description: The day the range's location last changed. On a paid plan.
          example: '2026-10-06'
    Asn:
      type: object
      description: |
        The autonomous system that announces the address. Every answer, with or
        without a key.
        Each field is present whenever the object is: `asn` is 0 and the rest
        empty where no announcement covers the address.
      required:
        - asn
        - name
        - domain
        - prefix
        - country
        - rpki_status
      properties:
        asn:
          type: integer
          format: int64
          description: The AS number, 0 when no announcement covers the address.
          example: 9009
        name:
          type: string
          description: Name of the organization that operates the AS.
          example: M247 Europe SRL
        domain:
          type: string
          description: The AS operator's own registrable domain.
          example: m247global.com
        type:
          type: string
          description: >-
            The kind of network the AS runs: isp, hosting, education, government or business. On a
            paid plan.
          example: hosting
        prefix:
          type: string
          description: The announced BGP prefix that covers the address, the most specific when several do.
          example: 146.70.116.0/24
        country:
          type: string
          description: The country the AS's registry assigned it to.
          example: RO
        rpki_status:
          type: string
          description: 'The announcement''s RPKI status: valid, invalid or not_found.'
          example: not_found
    UserAgentVerdict:
      type: object
      required:
        - agent
        - kind
        - verdict
      properties:
        agent:
          type: string
          description: >-
            The agent the user agent names, such as `Googlebot` or `Chrome`; `Unknown` where it
            names none.
          example: Googlebot
        kind:
          type: string
          description: |
            `browser`, `inapp`, `automation`, `bot`, `ai-bot`, `http-client` or
            `unknown`: what kind of client the user agent says it is.
          example: bot
        verdict:
          type: string
          enum:
            - verified
            - spoofed
            - unverifiable
            - not_bot
          description: |
            `verified`: the agent's operator vouches for this address as it.
            `spoofed`: the operator of a bot that publishes its addresses, or
            whose registered space it uses, does not vouch for this one, or this
            address posed as the bot before. `unverifiable`: a bot no published
            list or registered space can confirm. `not_bot`: a browser, an app or
            a script.
          example: verified
    BotDetail:
      type: object
      description: >-
        Bot IP's row: whose bot uses the address, the bots it serves or claimed to be, what they do,
        and how that is known.
      properties:
        provider:
          type: string
          description: >-
            The bot operator's ID; for an address that is not verified, the operator its claim
            named. Empty where no operator is known.
        provider_name:
          type: string
          description: That operator's name, empty where no operator is known.
        agents:
          type: array
          items:
            type: string
          description: >-
            The bots the address serves, as their user agents name them (`Googlebot`, `GPTBot`); for
            an address that is not verified, the bots it claimed to be. One address can serve
            several, and `[]` means none is named.
        categories:
          type: array
          items:
            type: string
          description: >-
            What those bots do: `search_engine`, `ai_training`, `ai_search`, `ai_assistant`,
            `ai_agent`, `seo`, `ads`, `preview`, `feed`, `monitoring`, `archiver`, `scanner`,
            `link_security`, `webhook` or `other`; `[]` where unknown.
        verified:
          type: boolean
          description: Whether the operator vouches for the address, so the bots in `agents` really are its.
        identity:
          type: string
          description: >-
            `verified` (the operator vouches for the address), `declared` (it names itself a bot
            that cannot be verified), `spoofed` (it claimed a bot whose operator vouches for other
            addresses) or `undeclared` (it hides as a browser and behaves as automation).
        verified_by:
          type: string
          description: >-
            How a verified address verified: `list` (the operator publishes it), `rdns` (its reverse
            DNS name ends in a suffix the operator documents and resolves back) or `owner` (the
            operator's own space, seen claiming its bot); empty when not verified.
        confidence:
          type: string
          description: '`high`, `medium` or `low`: how sure we are the address is what the row says.'
        first_seen:
          type: string
          format: date
          description: The first day the address was seen as such.
        last_seen:
          type: string
          format: date
          description: The last day it was.
    CarrierDetail:
      type: object
      description: |
        The mobile network whose space the address is, from our Carrier IP
        database. Every key is present when the object is populated; the object
        is `{}` when `is_carrier` is false.
      properties:
        name:
          type: string
          description: The mobile carrier.
          example: T-Mobile US
        mcc:
          type: string
          description: Its mobile country code.
          example: '310'
        mnc:
          type: string
          description: Its mobile network code.
          example: '260'
        country:
          type: string
          description: ISO 3166 country code.
          example: US
        confidence:
          type: string
          description: '`high`, `medium` or `low`.'
          example: high
    SatelliteDetail:
      type: object
      description: |
        The satellite operator whose space the address is, from our Satellite IP
        database. Every key is present when the object is populated; the object
        is `{}` when `is_satellite` is false.
      properties:
        provider:
          type: string
          description: The operator's ID in Satellite IP Provider.
          example: starlink
        provider_name:
          type: string
          description: The operator's name.
          example: Starlink
        orbit:
          type: string
          description: 'The orbit: `leo`, `meo` or `geo`.'
          example: leo
        segment:
          type: string
          description: Who the space serves, such as consumer or maritime.
          example: consumer
        country:
          type: string
          description: ISO 3166 country code.
          example: US
        asn:
          type: integer
          format: int64
          description: The AS the operator announces it from.
          example: 14593
        confidence:
          type: string
          description: '`high`, `medium` or `low`.'
          example: high
    SshDetail:
      type: object
      description: |
        The SSH server that answered on the address, from our SSH IP database.
        Every key is present when the object is populated; the object is `{}`
        when `is_ssh` is false.
      properties:
        port:
          type: integer
          description: The port the server answered on.
          example: 22
        banner:
          type: string
          description: Its banner.
          example: SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.5
        host_key_fp:
          type: string
          description: Its host key's fingerprint.
          example: SHA256:9Bq3Jrm6pVJ7QqV2c8l0pE6f8wJ4sZ4u5tYyH9cXo1E
        session_ok:
          type: boolean
          description: A session was set up.
          example: true
        first_seen:
          type: string
          format: date
          description: The first day it answered.
          example: '2026-08-04'
        last_seen:
          type: string
          format: date
          description: The last day it did.
          example: '2026-11-15'
    SmtpDetail:
      type: object
      description: |
        The mail server that answered on the address, from our SMTP IP database.
        Every key is present when the object is populated; the object is `{}`
        when `is_smtp` is false.
      properties:
        port:
          type: integer
          description: The port the server answered on.
          example: 25
        banner:
          type: string
          description: Its banner.
          example: 220 mail.example.com ESMTP Postfix
        session_ok:
          type: boolean
          description: A session was set up.
          example: true
        first_seen:
          type: string
          format: date
          description: The first day it answered.
          example: '2026-08-04'
        last_seen:
          type: string
          format: date
          description: The last day it did.
          example: '2026-11-15'
    WebDetail:
      type: object
      description: One port of the address that answered as a web server, from our Web IP database.
      required:
        - port
        - tls_ok
        - session_ok
        - status_code
        - server
        - location
        - title
        - cert_subject_cn
        - cert_subject_o
        - cert_issuer_dn
        - cert_browser_trusted
        - tls_version
        - first_seen
        - last_seen
      properties:
        port:
          type: integer
          description: 80 or 443.
          example: 443
        tls_ok:
          type: boolean
          description: A TLS handshake completed.
          example: true
        session_ok:
          type: boolean
          description: An HTTP response came back.
          example: true
        status_code:
          type: integer
          description: Its status, 0 where none came.
          example: 200
        server:
          type: string
          description: Its `Server` header.
          example: nginx
        location:
          type: string
          description: Where it redirected.
          example: ''
        title:
          type: string
          description: The page's title.
          example: Welcome to nginx!
        cert_subject_cn:
          type: string
          description: The certificate's subject common name.
          example: example.com
        cert_subject_o:
          type: string
          description: Its subject organization.
          example: ''
        cert_issuer_dn:
          type: string
          description: Its issuer.
          example: CN=R11,O=Let's Encrypt,C=US
        cert_browser_trusted:
          type: boolean
          description: Browsers trust it.
          example: true
        tls_version:
          type: string
          description: The TLS version negotiated, empty without TLS.
          example: TLS 1.3
        first_seen:
          type: string
          format: date
          description: The first day the port was open.
          example: '2026-08-04'
        last_seen:
          type: string
          format: date
          description: The last day it was.
          example: '2026-11-15'
    DnsResolverDetail:
      type: object
      description: |
        The open DNS resolver that answered on the address, from our DNS
        Resolver IP database. Every key is present when the object is populated;
        the object is `{}` when `is_dns_resolver` is false.
      properties:
        port:
          type: integer
          description: The port it answered on.
          example: 53
        recursion_available:
          type: boolean
          description: It offered recursion.
          example: true
        rcode:
          type: integer
          description: Its answer's response code.
          example: 0
        answer_correct:
          type: boolean
          description: Its answer was right.
          example: true
        first_seen:
          type: string
          format: date
          description: The first day it answered.
          example: '2026-08-04'
        last_seen:
          type: string
          format: date
          description: The last day it did.
          example: '2026-11-15'
    BitTorrentDetail:
      type: object
      description: |
        BitTorrent clients seen on the address over the last 90 days, from our
        BitTorrent IP database. Every key is present when the object is
        populated; the object is `{}` when `is_bittorrent` is false.
      properties:
        verified:
          type: boolean
          description: A client here answered, or two or more reported it at once.
          example: true
        id_matches_ip:
          type: boolean
          description: A client here derived its node ID from the address (BEP 42).
          example: false
        first_seen:
          type: string
          format: date
          description: The first day a client was seen here.
          example: '2026-08-21'
        last_seen:
          type: string
          format: date
          description: The last day.
          example: '2026-11-15'
        last_reachable:
          type: string
          description: The last day one answered, empty when none did.
          example: '2026-11-14'
        days_seen:
          type: integer
          description: On how many days.
          example: 37
        num_ports:
          type: integer
          description: Distinct ports over the window.
          example: 4
        peak_num_ports:
          type: integer
          description: The most on one day.
          example: 2
        indexer:
          type: boolean
          description: A DHT indexer rather than people.
          example: false
        clients:
          type: array
          items:
            type: string
          description: The two-letter codes its clients name themselves by.
          example:
            - qB
            - TR
    Company:
      type: object
      description: |
        Who uses the address, from our IP Company database. On a paid plan. Every
        key is present whenever the object is: empty strings where no record
        covers the address.
      required:
        - name
        - domain
      properties:
        name:
          type: string
          description: Who uses the address.
          example: M247 LTD Vienna Infrastructure
        domain:
          type: string
          description: Their domain.
          example: m247.ro
        type:
          type: string
          description: 'What kind of organization: hosting, isp, business, education or government.'
          example: hosting
        country:
          type: string
          description: ISO 3166 country code.
          example: AT
    AbuseContact:
      type: object
      description: |
        Where to report abuse from the address, from our IP Abuse Contact
        database. On a paid plan. Every key is present whenever the object is: empty
        strings where no record covers the address.
      required:
        - email
      properties:
        email:
          type: string
          description: Where to report abuse from the address.
          example: abuse@m247.ro
        name:
          type: string
          description: The contact.
          example: M247 Europe
        phone:
          type: string
          description: Its phone number.
          example: ''
        address:
          type: string
          description: Its postal address.
          example: Sos. Fabrica de Glucoza, Nr 11B, etaj 1, Sector 2, Bucuresti Romania
        country:
          type: string
          description: ISO 3166 country code.
          example: AT
        network:
          type: string
          description: The registry block it was derived from.
          example: 146.70.116.0-146.70.116.255
        validated:
          type: boolean
          description: ARIN reports the contact answered its yearly validation.
          example: false
        unvalidated_since:
          type: string
          description: Since when it has not.
          example: ''
    LookupError:
      type: object
      description: Every non-2xx response carries this shape.
      required:
        - error
      properties:
        error:
          type: string
          description: A human-readable explanation of the failure.
          example: not a valid IP address
    Error:
      type: object
      properties:
        rc:
          type: string
      required:
        - rc
    Standing:
      type: string
      description: |
        Where your license for a database family stands today. `licensed` is a
        live grant, `expired` one whose term has ended, and `unlicensed` a
        database published but never bought.
      enum:
        - expired
        - licensed
        - unlicensed
    DatabaseFormat:
      type: string
      description: A file format a database version is published in.
      enum:
        - csvgz
        - mmdb
    DatabaseFormatSize:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/DatabaseFormat'
        bytes:
          type: integer
          format: int64
          nullable: true
          description: |
            Size of the published file, or null when it has not been published
            yet. int64 because it is not hypothetical: resproxy_ip_14d's MMDB is
            4.58 GB, so a 32-bit field cannot carry the catalog and `list`
            throws for every caller rather than for that one entry.
      required:
        - format
        - bytes
    Database:
      type: object
      description: |
        One database FAMILY, with your organization's license beside it. A license covers
        the family, while a download names a specific version, so the IDs you
        pass to the download and checksum endpoints come from `versions`.
      properties:
        base:
          type: string
          description: The database family, e.g. `vpn_ip`. What the license is held against.
          example: vpn_ip
        name:
          type: string
          example: VPN IP
        summary:
          type: string
        license_type:
          type: string
          nullable: true
          enum:
            - evaluation
            - standard
            - redistribute
            - null
          description: |
            What a license permits you to do with the data. Null for a family
            you hold no license for, which is every one with standing
            `unlicensed`.
        starts:
          type: string
          format: date-time
          nullable: true
        expires:
          type: string
          format: date-time
          nullable: true
          description: >-
            A hard stop. Null when the license has no end date, which is the normal case for a
            rolling agreement, and when there is no license. A rolling license reports its turnover
            date in renews_at instead.
        renews_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When a rolling license next renews. Null when the license has no defined term, when
            expires sets a hard stop instead, and when there is no license.
        notice_due_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The last day notice of non-renewal can be given for the term ending at renews_at. Null
            whenever renews_at is, and when the agreement records no notice period.
        in_term:
          type: boolean
          description: False when the license has lapsed; downloads are refused.
        standing:
          $ref: '#/components/schemas/Standing'
        open:
          type: boolean
          description: |
            An Open database: free under CC BY-SA 4.0 (credit VPNDetection,
            https://vpndetection.io, and share what you build from it under the
            same license). Every organization holds a `standard` license to it
            from the start, which `standing` and `license_type` report like any
            other.
        versions:
          type: array
          description: |
            Every published version of this family. The `id` here is what the
            download and checksum endpoints take.
          items:
            $ref: '#/components/schemas/DatabaseVersion'
      required:
        - base
        - name
        - summary
        - license_type
        - starts
        - expires
        - renews_at
        - notice_due_at
        - in_term
        - standing
        - open
        - versions
    DatabaseVersion:
      type: object
      properties:
        id:
          type: string
          description: The versioned database ID, e.g. `vpn_ip_v1`. Pass this to download.
          example: vpn_ip_v1
        version:
          type: integer
          example: 1
        summary:
          type: string
        formats:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseFormatSize'
        sample_formats:
          type: array
          description: The formats an evaluation sample is published in, if any.
          items:
            $ref: '#/components/schemas/DatabaseFormat'
      required:
        - id
        - version
        - formats
    Download:
      type: object
      description: |
        One download ATTEMPT, refusals included - a denial is what answers "it
        stopped working", so they are listed rather than dropped.
      properties:
        dataset_id:
          type: string
        format:
          type: string
        outcome:
          type: string
          enum:
            - ok
            - unauthorized
            - denied
            - expired
            - unknown
            - unavailable
        sample:
          type: boolean
          description: The evaluation sample rather than the database itself.
        open:
          type: boolean
          description: A download of an Open database.
        bytes:
          type: integer
          format: int64
          nullable: true
          description: |
            Object size at redirect time, NOT bytes delivered: the transfer is a
            presigned redirect straight to object storage, so we never observe it.
            int64 for the same reason as DatabaseFormatSize.bytes - it is the
            size of the same object.
        http_status:
          type: integer
          nullable: true
        apikey_id:
          type: string
          nullable: true
          description: |
            The key that made the request. Null when the org acted through the
            console rather than through a key.
        client_ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
      required:
        - dataset_id
        - format
        - outcome
        - sample
        - open
        - bytes
        - http_status
        - apikey_id
        - client_ip
        - user_agent
        - created
    DbChecksums:
      type: object
      description: The published digests for one database file.
      properties:
        md5:
          type: string
        sha1:
          type: string
        sha256:
          type: string
        sha512:
          type: string
      required:
        - md5
        - sha1
        - sha256
        - sha512
    DatabaseMetadataColumn:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
      required:
        - name
        - type
    DatabaseMetadata:
      type: object
      properties:
        id:
          type: string
        update_freq:
          type: string
          description: How often a new build is published
        updated:
          type: string
          format: date
        entries:
          type: integer
          description: Row count in the current build
        schema:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DatabaseMetadataColumn'
          description: Columns, keyed by format
        sample:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
          description: A few real rows, keyed by format
        size:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Bytes per format
        sample_size:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Bytes per format of the evaluation sample, where one is published
        sample_entries:
          type: integer
          description: Row count in the evaluation sample
      required:
        - id
        - updated
        - entries
        - schema
    Entitlement:
      type: object
      required:
        - org_id
        - apikey
        - plan
        - usage
      properties:
        org_id:
          type: string
          format: uuid
          description: The organization the key belongs to.
        apikey:
          $ref: '#/components/schemas/EntitlementApikey'
        plan:
          $ref: '#/components/schemas/EntitlementPlan'
        usage:
          $ref: '#/components/schemas/EntitlementUsage'
    EntitlementApikey:
      type: object
      description: |
        The credential itself. The key is never echoed - only its ID, which is
        what the console shows and what you can act on.
      required:
        - id
        - expires
        - allowed_cidrs
      properties:
        id:
          type: string
          format: uuid
        expires:
          type: string
          format: date-time
          nullable: true
          description: Null for a key with no end date, which is the normal case.
        allowed_cidrs:
          type: array
          items:
            type: string
          description: |
            The source addresses this key may be used from. EMPTY means
            unrestricted, never "deny all".
    EntitlementPlan:
      type: object
      required:
        - key
        - name
        - tier
      properties:
        key:
          type: string
          description: |
            The plan the organization is on, as an identifier that is never
            renamed or reused: `free` for the free plan, or a paid plan's key.
            Compare against it and show `name`. On `free`, usage counts its
            trial, the lookups answered with every field. The Data plan is a key
            per quota, `data_1` to `data_7`, each named Data.
          example: data_4
        name:
          type: string
          description: |
            The plan's name, as the site and console show it: `Unlimited` for
            the free plan. Show this rather than a name built from `key`: a
            plan's name can change, and its key never does.
          example: Data
        tier:
          type: string
          enum:
            - free
            - starter
            - scale
            - max
          description: |
            The field tier, which decides how much of a lookup answer comes
            back; `free` is the free plan's. This list never gains a value: a
            new plan reports one of these. What each tier includes is documented
            on the lookup endpoint rather than repeated here, so there is one
            place it can be wrong.
    EntitlementUsage:
      type: object
      required:
        - requests
        - quota
        - hard_limit
        - window_start
        - window_end
      properties:
        requests:
          type: integer
          format: int64
          description: |
            Requests counted in the current window. The same number the lookup
            API gates on, and it can lag by a few seconds.
        quota:
          type: integer
          format: int64
          description: What the plan includes. Zero on a plan that includes none.
        hard_limit:
          type: integer
          format: int64
          nullable: true
          description: |
            Where full answers stop: past it, a paid key is answered with
            Unlimited's fields and `cap_reached: true`, uncharged, until the
            window ends or the cap is raised. NULL means never, which is the
            normal state of an uncapped paid plan and is not the same as zero.
            Above the quota and below this, requests are served and billed as
            overage.
        window_start:
          type: string
          format: date-time
          description: |
            When the current allowance period began. On the free plan, when
            its trial began, or now before a first lookup starts it.
        window_end:
          type: string
          format: date-time
          description: |
            When the allowance next resets. On the free plan, when its trial
            ends, which it does once.
    EntitlementError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    AccountRc:
      type: object
      properties:
        rc:
          type: string
          description: The outcome. `SUCCESS` on success; otherwise the reason.
      required:
        - rc
    Identity:
      type: object
      properties:
        rc:
          type: string
        user:
          $ref: '#/components/schemas/AccountUser'
        org:
          $ref: '#/components/schemas/AccountOrgRef'
        scopes:
          type: array
          items:
            type: string
          description: What this credential may do right now.
      required:
        - rc
        - user
        - org
        - scopes
    AccountUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullname:
          type: string
        email:
          type: string
          format: email
      required:
        - id
    AccountOrgRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    AccountOrgWrap:
      type: object
      properties:
        rc:
          type: string
        org:
          $ref: '#/components/schemas/AccountOrg'
      required:
        - rc
        - org
    AccountOrg:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created:
          type: string
          format: date-time
          nullable: true
      required:
        - id
    ApikeyList:
      type: object
      properties:
        rc:
          type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApikeyDetail'
      required:
        - rc
        - keys
    ApikeyDetail:
      description: Key METADATA. Never the key itself.
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: The leading, non-secret part, so a key is recognizable without storing it.
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        allowed_cidrs:
          type: array
          items:
            type: string
          description: Source-IP allowlist. EMPTY MEANS UNRESTRICTED, not deny-all.
        allowed_scopes:
          type: array
          items:
            type: string
        retrievable:
          type: boolean
          description: >-
            Whether this key's secret can still be read back. False permanently for a key issued
            before secrets were stored recoverably.
      required:
        - id
        - name
        - key_prefix
        - created
    AccountCreateApikeyRequest:
      type: object
      properties:
        name:
          type: string
          description: A label you will recognize later. Shown wherever the key is listed.
        allowed_scopes:
          type: array
          items:
            type: string
          description: >-
            What the new key may do. Omit for a key that carries no named scope, which is the safe
            default.
      required:
        - name
    AccountCreatedApikey:
      type: object
      properties:
        rc:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: The secret. Returned once, here, and never again.
        key_prefix:
          type: string
        allowed_cidrs:
          type: array
          items:
            type: string
        allowed_scopes:
          type: array
          items:
            type: string
      required:
        - rc
        - id
        - key
    AccountRevealedApikey:
      type: object
      properties:
        rc:
          type: string
        key:
          type: string
          description: The secret.
      required:
        - rc
        - key
    OauthMetadata:
      type: object
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        device_authorization_endpoint:
          type: string
        revocation_endpoint:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        client_id_metadata_document_supported:
          type: boolean
          description: Any client may sign in with an https `client_id` serving its own metadata.
        registration_endpoint:
          type: string
          description: RFC 7591 dynamic client registration, for a client that cannot serve its own metadata.
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Always `none`. Every client is public and has no secret.
        authorization_response_iss_parameter_supported:
          type: boolean
          description: RFC 9207. A redirect back from the authorization endpoint carries `iss`.
        service_documentation:
          type: string
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
    DeviceAuthorizationRequest:
      type: object
      properties:
        client_id:
          type: string
        scope:
          type: string
          description: >-
            Space-delimited. Anything your client is not registered for is dropped rather than
            refused.
        resource:
          type: string
          description: 'RFC 8707: what the token is for.'
      required:
        - client_id
    DeviceAuthorization:
      type: object
      properties:
        device_code:
          type: string
          description: Yours. Poll with it; never show it to anyone.
        user_code:
          type: string
          description: Short and typable. This is what the person confirms.
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
          description: The same page with the code already filled in.
        expires_in:
          type: integer
          description: Seconds until both codes expire.
        interval:
          type: integer
          description: Seconds between polls.
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
        - interval
    TokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          description: '`urn:ietf:params:oauth:grant-type:device_code`, `authorization_code` or `refresh_token`.'
        client_id:
          type: string
        device_code:
          type: string
          description: Required by the device code grant.
        code:
          type: string
          description: Required by the authorization code grant.
        code_verifier:
          type: string
          description: Required by the authorization code grant.
        redirect_uri:
          type: string
          description: >-
            Required by the authorization code grant: the `redirect_uri` the code was issued
            against, exactly.
        resource:
          type: string
          description: 'Authorization code grant, optional: RFC 8707, and it must name what was authorized.'
        refresh_token:
          type: string
          description: Required by the refresh token grant.
      required:
        - grant_type
        - client_id
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          description: Always `Bearer`.
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: Always returned. A refresh consumes the token it presents, so keep this one.
        scope:
          type: string
          description: What was actually granted, which may be narrower than what was asked for.
        mslm:apikey_id:
          type: string
          description: |
            Not part of OAuth, and only for our own clients. The ID of the API
            key the person picked when they approved, returned by every grant
            while this authorization may still read that key back. Absent when
            no key was picked, or when the person's role no longer allows
            reading keys back.
        mslm:apikey:
          type: string
          description: |
            Not part of OAuth, and only for our own clients: a client that signed
            in with a Client ID Metadata Document or registered itself never
            receives a key. The API
            key itself, so a device ends up holding an ordinary key. Returned by
            the device code and authorization code grants only, never by a
            refresh, and only alongside
            `mslm:apikey_id`. Absent when that key's secret cannot be read back,
            which is the case for a key created before keys could be shown again
            in the console; a rotated key can be.
      required:
        - access_token
        - token_type
        - expires_in
    ClientRegistrationRequest:
      type: object
      properties:
        redirect_uris:
          type: array
          items:
            type: string
          description: One to ten, each matched exactly, apart from a loopback one's port.
        client_name:
          type: string
          description: >-
            Shown to the person as your client's own claim, marked unverified, beside where its
            redirect goes.
        grant_types:
          type: array
          items:
            type: string
          description: Must include `authorization_code` when given.
        response_types:
          type: array
          items:
            type: string
          description: Must include `code` when given.
        token_endpoint_auth_method:
          type: string
          description: Read as `none`, whatever is sent.
      required:
        - redirect_uris
    ClientRegistration:
      type: object
      properties:
        client_id:
          type: string
        client_id_issued_at:
          type: integer
          format: int64
          description: Unix seconds. 64-bit, since 32 bits run out on 2038-01-19.
        client_name:
          type: string
          description: As the person will see it.
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
          description: '`authorization_code` and `refresh_token`.'
        response_types:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
          description: Always `none`.
        scope:
          type: string
          description: 'The most this client may be granted: `apikeys.use`.'
      required:
        - client_id
        - client_id_issued_at
        - client_name
        - redirect_uris
        - token_endpoint_auth_method
    RevokeRequest:
      type: object
      properties:
        token:
          type: string
          description: An access token or a refresh token.
        client_id:
          type: string
          description: Accepted and not checked.
      required:
        - token
    OauthError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
      required:
        - error
  responses:
    Unauthorized:
      description: Missing or invalid key, or the key lacks the db.download scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KeyOverHttp:
      description: >-
        The key was sent over plain HTTP (`KEY_OVER_HTTP`), refused whatever it is. By then it has
        crossed in the clear, so use `https://` and replace a key that did
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownDataset:
      description: No such database
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAvailable:
      description: Today's copy has not been published yet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountUnauthorized:
      description: No credential was presented, or it is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRc'
    AccountForbidden:
      description: |
        The credential does not hold the scope this endpoint requires
        (`FORBIDDEN`); the missing scope is deliberately not named. Or the
        credential was sent over plain HTTP, refused whatever it is
        (`KEY_OVER_HTTP`): use `https://`.
        `rc`: `FORBIDDEN`, `KEY_OVER_HTTP`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRc'
    AccountNotFound:
      description: No such key in this organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRc'
    AccountInvalid:
      description: The request body is missing a required field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRc'
  parameters:
    ApikeyIdParam:
      name: id
      in: path
      required: true
      description: The key's ID, as returned by the list endpoint. Never the key itself.
      schema:
        type: string
        format: uuid
x-tagGroups:
  - name: VPNDetection IP API
    tags:
      - Lookup
  - name: VPNDetection Database API
    tags:
      - Database
  - name: VPNDetection Entitlement API
    tags:
      - Entitlement
  - name: VPNDetection IAM API
    tags:
      - Account
      - Organization
      - API keys
  - name: VPNDetection Authorization
    tags:
      - Authorization

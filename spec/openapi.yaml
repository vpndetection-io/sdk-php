  /myip:
    get:
      operationId: lookupMyIp
      tags:
        - Lookup
      summary: My IP
      description: |
        Answers what is known about the address this request came from, which is
        the same answer `GET /{ip}` gives for that address: the presented key
        decides which fields come back, and the request counts against the same
        limits.

        The address is the one our edge observed, so a request through a proxy
        or a VPN reports the exit it left through rather than the machine that
        made it. That is usually the point of asking.
      parameters:
        - in: query
          name: user_agent
          required: false
          schema:
            type: string
            maxLength: 1024
          description: |
            The `User-Agent` header of the request you are deciding on. With
            every field, on a paid plan or the trial, the answer then carries
            `user_agent`: the agent it names, and whether this address bears
            that out. Never kept, and nothing sent with a lookup feeds our data.
          example: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
      responses:
        '200':
          description: |
            The classification of your own address. Present fields are those
            your plan includes; see the tier table in the API description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
              examples:
                unlimited:
                  summary: Unlimited, no API key
                  value:
                    ip: 146.70.116.130
                    is_bogon: false
                    is_vpn: true
                    is_relay: false
                    is_tor: false
                    is_anycast: false
                    relay: {}
                    tor: {}
                    location:
                      continent: EU
                      continent_name: Europe
                      country: AT
                      country_name: Austria
                      timezone: Europe/Vienna
                      currency_code: EUR
                      currency_name: Euro
                      currency_symbol: €
                      flag_emoji: 🇦🇹
                      flag_unicode: U+1F1E6 U+1F1F9
                    asn:
                      asn: 9009
                      name: M247 Europe SRL
                      domain: m247global.com
                      prefix: 146.70.116.0/24
                      country: RO
                      rpki_status: not_found
                    hostname: ''
        '401':
          description: The presented API key is unknown, revoked, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              examples:
                invalid:
                  value:
                    error: invalid API key
                revoked:
                  value:
                    error: API key revoked
                expired:
                  value:
                    error: API key expired
        '403':
          description: |
            The key restricts which source addresses may use it and this
            request came from none of them, or the key lacks the `ip.lookup`
            scope (IP lookup, in the console's key settings), or the key was
            sent over plain HTTP, where anyone on the network path could read
            it. Rotate a key that was.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              examples:
                sourceNotAllowed:
                  value:
                    error: source address not allowed for this API key
                scopeMissing:
                  value:
                    error: API key lacks the ip.lookup scope; add IP lookup to it in the console
                plainHttp:
                  value:
                    error: API key sent over plain HTTP; use https://
        '429':
          description: |
            A rate limit, always with `Retry-After`. A paid plan's overage cap is
            never a `429` by itself: it answers `200` with Unlimited's fields and
            `cap_reached` `true`, and a burst past it is rate limited as an Unlimited one is.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              examples:
                rateLimited:
                  summary: Transient, sent with Retry-After
                  value:
                    error: rate limit exceeded
                unlimitedRateLimited:

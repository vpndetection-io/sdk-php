                    $ref: '#/components/schemas/DbChecksums'
                required:
                  - id
                  - format
                  - checksums
        '400':
          description: The database is not built in the requested format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Your organization holds no license for this database (`NOT_LICENSED`), or its license
            term has ended, so renew it (`LICENSE_EXPIRED`); or the key was sent over plain HTTP
            (`KEY_OVER_HTTP`), so use `https://`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/UnknownDataset'
        '503':
          $ref: '#/components/responses/NotAvailable'
      security:
        - apiKeyQuery: []
        - apiKeyHeader: []
        - bearerAuth: []
  /api/v1/database/downloads:
    get:
      operationId: listDownloads
      tags:

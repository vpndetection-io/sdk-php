      security:
        - apiKeyQuery: []
        - apiKeyHeader: []
        - bearerAuth: []
  /api/v1/entitlement:
    get:
      operationId: myEntitlement
      tags:
        - Entitlement
      summary: Plan and usage
      description: |
        Answers what the presented key is, what plan is behind it, and what has
        been spent against that plan's allowance in the current window.
      responses:
        '200':
          description: The key's entitlements and consumption.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
              examples:
                paid:
                  summary: A key on a paid plan, uncapped
                  value:
                    org_id: 85bb51e4-2eb6-4a31-8e4d-02ba8b98fe61
                    apikey:
                      id: 0ab424cc-7619-4dad-b027-afacdc2cedb0
                      expires: null
                      allowed_cidrs: []
                    plan:
                      key: data_4
                      name: Data
                      tier: max
                    usage:
                      requests: 580
                      quota: 1000000
                      hard_limit: null
                      window_start: '2026-09-04T07:00:00Z'
                      window_end: '2026-10-04T07:00:00Z'
                free:
                  summary: >-
                    A key of an organization on the free plan, Unlimited: its usage is its trial,
                    the lookups answered with every field while it lasts, against the trial's limit.
                    Nothing stops it past the trial, its lookups answering with Unlimited's fields,
                    so there is no hard limit
                  value:
                    org_id: f32191d0-ef02-450e-a505-eb5814c35cab
                    apikey:
                      id: 10c2b437-3aa2-4a63-bd17-8e7c8c7f0def
                      expires: null
                      allowed_cidrs: []
                    plan:
                      key: free
                      name: Unlimited
                      tier: free
                    usage:
                      requests: 37
                      quota: 250000
                      hard_limit: null
                      window_start: '2026-11-24T10:15:00Z'
                      window_end: '2026-12-08T10:15:00Z'
        '401':
          description: No key was presented, or it is unknown, revoked or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementError'
              examples:
                missing:
                  value:
                    error: an API key is required
                invalid:
                  value:
                    error: invalid API key
                revoked:
                  value:
                    error: API key revoked
                expired:
                  value:
                    error: API key expired
        '403':
          description: |
            The key restricts which source addresses may use it, and this
            request did not come from one of them; or the key was sent over
            plain HTTP, which is refused whatever the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementError'
              examples:

              schema:
                $ref: '#/components/schemas/LookupError'
              examples:
                malformed:
                  value:
                    error: body must be a JSON object whose ips member is an array of strings
                size:
                  value:
                    error: ips must hold between 1 and 1000 addresses
        '401':
          description: |
            No API key was presented for more than one address, or the one
            presented is unknown, revoked, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              examples:
                noKey:
                  value:
                    error: POST /batch needs an API key on a paid plan
                invalid:
                  value:
                    error: invalid API key
                revoked:
                  value:
                    error: API key revoked
                expired:
                  value:
                    error: API key expired
        '402':
          description: |
            The key is on the free plan and the batch names more than one
            address: a batch needs a paid plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              example:
                error: POST /batch needs a paid plan
        '403':
          description: |
            The key restricts which source addresses may use it and this
            request came from none of them, or the key lacks the `ip.lookup`
            scope (IP lookup, in the console's key settings), or the key was
            sent over plain HTTP, where anyone on the network path could read
            it. Rotate a key that was.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              examples:
                sourceNotAllowed:
                  value:
                    error: source address not allowed for this API key
                scopeMissing:
                  value:
                    error: API key lacks the ip.lookup scope; add IP lookup to it in the console
                plainHttp:
                  value:
                    error: API key sent over plain HTTP; use https://
        '413':
          description: The body is larger than any batch of 1000 addresses can be.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              example:
                error: request body too large
        '429':
          description: |
            The rate limit refused the whole call. Always transient and always
            with `Retry-After`; a reached overage cap answers each entry in a
            `200` instead, and a burst past it is rate limited as an Unlimited one is.
          headers:
            Retry-After:
              description: Seconds to wait before retrying the call.
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupError'
              examples:
                rateLimited:
                  summary: Transient, sent with Retry-After
                  value:
                    error: rate limit exceeded
                unlimitedRateLimited:
                  summary: Unlimited's one address, a burst, sent with Retry-After
                  value:
                    error: rate limit for Unlimited lookups exceeded; retry shortly, or use a paid plan
                cappedRateLimited:
                  summary: Past a paid plan's overage cap, a burst, sent with Retry-After
                  value:
                    error: >-
                      rate limit for lookups past your overage cap exceeded; retry shortly, or raise
                      the cap in Billing
  /api/v1/database/list:
    get:
      operationId: listDatabases
      tags:
        - Database
      summary: List
      description: |
        Every database this organization can see, licensed or not. `standing`
        says where its license stands: `licensed`, `expired`, or `unlicensed`
        for one never bought.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  databases:
                    type: array
                    items:
                      $ref: '#/components/schemas/Database'
                required:
                  - databases
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/KeyOverHttp'
      security:
        - apiKeyQuery: []
        - apiKeyHeader: []
        - bearerAuth: []
  /api/v1/database/download:
    get:
      operationId: downloadDatabase
      tags:
        - Database
      summary: Download
      description: >
        Redirects (`302`) to a time-limited link to the database file. The link only has to be valid
        when the download starts, so a long one isn't cut off when it expires.
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
          description: Dataset ID, e.g. vpn_ip_extended_v1
        - in: query
          name: format
          required: true
          schema:
            $ref: '#/components/schemas/DatabaseFormat'
          description: |
            Not every database is built in every format. The `_provider`
            catalogs are keyed by provider ID rather than by IP range, so no
            MMDB exists for them.
        - in: query
          name: build
          required: false
          schema:
            type: string
            pattern: ^[0-9]{8}\.[a-z0-9]{6}$
            example: 20261105.0t53s5
          description: |
            One build of the database, by the name a `database.updated` webhook
            gives it, so the file is the one whose `sha256` the webhook carries.
            Without it, the build that is live.
      responses:
        '302':
          description: Follow the Location header to object storage
          headers:
            Location:
              schema:
                type: string
        '400':
          description: >-
            The database is not built in the requested format (`INVALID_FORMAT`), or `build` is not
            a build's name (`INVALID_BUILD`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Your organization holds no license for this database (`NOT_LICENSED`), or its license
            term has ended, so renew it (`LICENSE_EXPIRED`); or the key was sent over plain HTTP
            (`KEY_OVER_HTTP`), so use `https://`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >-
            The build named in `build` is no longer kept (`BUILD_GONE`); builds are kept 7 days.
            Download without `build` for the live one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Licensed, but today's copy has not been published yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - apiKeyQuery: []
        - apiKeyHeader: []
        - bearerAuth: []
  /api/v1/database/metadata:
    get:
      operationId: databaseMetadata
      tags:
        - Database
      summary: Metadata
      description: |
        Poll this to decide whether today's build is worth fetching: it carries
        `updated` and `entries` without downloading anything.

        No `format` parameter - one document describes every format the database
        is built in. Needs no license: it answers for every database `list`
        returns, whatever its `standing`.
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/KeyOverHttp'
        '404':
          $ref: '#/components/responses/UnknownDataset'
        '503':
          $ref: '#/components/responses/NotAvailable'
      security:
        - apiKeyQuery: []
        - apiKeyHeader: []
        - bearerAuth: []
  /api/v1/database/checksum:
    get:
      operationId: databaseChecksum
      tags:
        - Database

  - name: VPNDetection IP API
    tags:
      - Lookup
  - name: VPNDetection Database API
    tags:
      - Database
  - name: VPNDetection Entitlement API
    tags:
      - Entitlement
  - name: VPNDetection IAM API
    tags:
      - Account
      - Organization
      - API keys
  - name: VPNDetection Authorization
    tags:
      - Authorization
